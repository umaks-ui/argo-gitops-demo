apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: hello-app

  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/argo-gitops-demo.git
    targetRevision: HEAD
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-demo

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
